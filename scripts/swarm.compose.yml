# Used by `npm run swarm` (scripts/swarm.mjs) on top of docker-compose.yml:
# publishes Postgres and Redis on random 127.0.0.1 ports (looked up with `docker compose port`),
# so the gateway can run from source while 10016 stays the only fixed port.
services:
  postgres:
    ports:
      - "127.0.0.1::5432"
  redis:
    ports:
      - "127.0.0.1::6379"
