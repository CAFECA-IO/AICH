# Used by `npm run swarm` (scripts/swarm.mjs) on top of docker-compose.yml:
# publishes Postgres and Redis on localhost so the gateway can run from source.
services:
  postgres:
    ports:
      - "127.0.0.1:${SWARM_PG_PORT:-10018}:5432"
  redis:
    ports:
      - "127.0.0.1:${SWARM_REDIS_PORT:-10019}:6379"
